name: CI

on:
  - push
  - pull_request_target

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install libimage-exiftool-perl
        uses: awalsh128/cache-apt-pkgs-action@5513791f75b039e2a79653b1a92238d3fb8d99b4 # v1.6.2
        with:
          packages: libimage-exiftool-perl
          version: 1.0

      # run image metadata check before installing node dependencies to detect image issue early even if pnpm install or format fails
      - name: Check for image metadata
        working-directory: ./public/images/cat
        run: |
          ./check-image-metadata.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          cache: true
          run_install: |
            - args: [--frozen-lockfile]

      - name: Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm run build

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm lint
